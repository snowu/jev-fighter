<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animation Lab</title>
<style>
  :root { --bg: #0e1014; --panel: #151922; --line: #2a303c; --text: #e8eaf0; --muted: #8b93a5; --bad: #ff5a4a; --good: #59c98b; --accent: #f2c14e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  h1 { margin: 0; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { background: #1d222d; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  .seg button.on { border-color: var(--accent); background: #2b2616; }
  #summary { margin-left: auto; color: var(--muted); }
  #summary.bad { color: var(--bad); } #summary.good { color: var(--good); }
  main { padding: 12px 16px 40px; }
  .row { display: grid; grid-template-columns: 180px 1fr; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding: 8px 0; }
  .row h3 { margin: 0; font-size: 13px; cursor: pointer; }
  .row h3 small { display: block; color: var(--muted); font-weight: 400; }
  .row h3.bad { color: var(--bad); }
  .thumbs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .thumb { flex: none; position: relative; border: 2px solid transparent; border-radius: 6px; cursor: pointer; }
  .thumb canvas { display: block; border-radius: 4px; background: #11141a; }
  .thumb.bad { border-color: var(--bad); }
  .thumb.hit { box-shadow: 0 0 0 2px var(--accent); }
  .thumb span { position: absolute; left: 4px; top: 2px; font-size: 10px; color: var(--muted); }
  #viewer { position: fixed; inset: 0; background: rgba(8, 10, 14, 0.94); display: none; z-index: 5; grid-template-columns: 1fr 340px; }
  #viewer.open { display: grid; }
  #view3d { width: 100%; height: 100vh; display: block; }
  #side { background: var(--panel); border-left: 1px solid var(--line); padding: 14px; overflow: auto; }
  #side h2 { margin: 0 0 8px; font-size: 14px; }
  #side input[type=range] { width: 100%; }
  #fails div { color: var(--bad); margin: 3px 0; }
  #fails .ok { color: var(--good); }
  .muted { color: var(--muted); }
  kbd { background: #262c38; border-radius: 3px; padding: 0 5px; }
</style>
</head>
<body>
<header>
  <h1>Animation Lab</h1>
  <div class="seg" id="chars"></div>
  <div class="seg" id="groups"></div>
  <div id="summary">loading models…</div>
</header>
<main id="sheet"></main>
<div id="viewer">
  <canvas id="view3d"></canvas>
  <div id="side">
    <h2 id="vtitle"></h2>
    <div class="muted" id="vinfo"></div>
    <p><input type="range" id="scrub" min="0" max="10" value="0"></p>
    <p><button id="play">Play</button> <label><input type="checkbox" id="slow"> ¼ speed</label> <button id="close">Close</button></p>
    <div id="fails"></div>
    <p class="muted">Drag to orbit. <kbd>←</kbd>/<kbd>→</kbd> step a frame, <kbd>Space</kbd> play, <kbd>Esc</kbd> close. The red ghost marks the opponent at the move's reach; the yellow dot is the hit point.</p>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
<script type="module" src="./game/lab-page.js"></script>
</body>
</html>
